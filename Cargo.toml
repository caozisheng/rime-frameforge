[workspace]
members = ["crates/rime-core", "crates/rime-wasm", "crates/rime-dng", "crates/rime-isp", "crates/rime-quant", "crates/rime-native-gpu", "crates/rime-cli", "crates/rime-scene", "crates/rime-iq", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytemuck = "1.24"
wgpu = { version = "29.0.4", default-features = false, features = ["std", "vulkan", "wgsl", "noop"] }
pollster = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
clap = { version = "4.6.3", features = ["derive"] }
base64 = "0.22.1"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
wasm-bindgen = "0.2"
[profile.dev.package."*"]
opt-level = 2


[profile.dev.package.rime-dng]
opt-level = 3

[profile.dev.package.rime-desktop]
opt-level = 3

[profile.dev.package.gamut-dng]
opt-level = 3

[profile.dev.package.gamut-ifd]
opt-level = 3

[profile.dev.package.gamut-bitstream]
opt-level = 3

[profile.dev.package.gamut-jxl]
opt-level = 3

[profile.dev.package.jxl]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
