name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Validate release version
        shell: pwsh
        run: .github/scripts/check-version.ps1 -Tag '${{ steps.release.outputs.tag }}'

      - name: Build Windows artifacts
        shell: pwsh
        run: .github/scripts/build-windows.ps1 -OutputDirectory release-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rime-frameforge-windows-${{ steps.release.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
